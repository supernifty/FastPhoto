<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastPhoto - Photo Search</title>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            min-height: 100vh;
        }
        .header {
            position: sticky;
            top: 0;
            background: #1a1a1a;
            border-bottom: 1px solid #333;
            padding: 1rem 2rem;
            z-index: 100;
        }
        .header h1 {
            font-size: 1.25rem;
            font-weight: 500;
            color: #888;
            margin-bottom: 0.75rem;
        }
        .search-input {
            width: 100%;
            max-width: 600px;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 8px;
            color: #e0e0e0;
            outline: none;
        }
        .search-input:focus { border-color: #666; }
        .search-input::placeholder { color: #666; }

        .tabs {
            display: flex;
            gap: 0;
            border-bottom: 1px solid #333;
            padding: 0 2rem;
            background: #1a1a1a;
        }
        .tab {
            padding: 0.75rem 1.5rem;
            color: #888;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        .tab:hover { color: #ccc; }
        .tab.active { color: #e0e0e0; border-bottom-color: #666; }

        #results, #index-panel {
            padding: 1.5rem 2rem;
        }
        .hidden { display: none; }

        .photo-count { color: #888; margin-bottom: 1rem; font-size: 0.9rem; }
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }
        .photo-card {
            background: #2a2a2a;
            border-radius: 8px;
            overflow: hidden;
        }
        .photo-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }
        .photo-info { padding: 0.75rem; position: relative; }
        .photo-desc {
            font-size: 0.85rem;
            color: #ccc;
            margin-bottom: 0.5rem;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .photo-tags { display: flex; flex-wrap: wrap; gap: 0.25rem; }
        .tag {
            font-size: 0.7rem;
            padding: 0.15rem 0.5rem;
            background: #3a3a3a;
            border-radius: 4px;
            color: #aaa;
        }
        .delete-btn {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            background: rgba(0,0,0,0.6);
            border: none;
            border-radius: 4px;
            padding: 0.25rem 0.5rem;
            cursor: pointer;
            font-size: 0.9rem;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .photo-card:hover .delete-btn { opacity: 1; }
        .delete-btn:hover { background: rgba(255,80,80,0.8); }
        .photo-card.deleting { opacity: 0.3; transition: opacity 0.3s; }

        .empty-state { text-align: center; padding: 4rem 2rem; color: #666; }
        .empty-state svg { width: 64px; height: 64px; margin-bottom: 1rem; opacity: 0.5; }

        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #1a1a1a;
            border-top: 1px solid #333;
            padding: 0.5rem 2rem;
            font-size: 0.8rem;
            color: #666;
            text-align: center;
        }

        .index-form { max-width: 500px; }
        .form-group { margin-bottom: 1rem; }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #aaa;
            font-size: 0.9rem;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 0.5rem 0.75rem;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 6px;
            color: #e0e0e0;
            font-size: 0.9rem;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #666;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .checkbox-group input[type="checkbox"] {
            width: auto;
        }
        .btn {
            padding: 0.6rem 1.5rem;
            background: #4a4a4a;
            border: none;
            border-radius: 6px;
            color: #e0e0e0;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover { background: #5a5a5a; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .progress-bar {
            margin-top: 1.5rem;
            background: #2a2a2a;
            border-radius: 8px;
            padding: 1rem;
        }
        .progress-track {
            height: 8px;
            background: #3a3a3a;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 0.5rem;
        }
        .progress-fill {
            height: 100%;
            background: #4a9eff;
            transition: width 0.3s;
        }
        .progress-text {
            font-size: 0.85rem;
            color: #888;
        }
        .progress-text.error { color: #ff6b6b; }
    </style>
</head>
<body>
    <div class="header">
        <h1>FastPhoto</h1>
        <input
            type="text"
            class="search-input"
            placeholder="Search your photos..."
            hx-get="/search"
            hx-target="#results"
            hx-trigger="keyup changed delay:300ms, search"
            name="q"
            autofocus
        >
    </div>
    <div class="tabs">
        <div class="tab active" onclick="showTab('search')">Search</div>
        <div class="tab" onclick="showTab('settings')">Settings</div>
    </div>
    <div id="results">
        <div class="empty-state">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909M3.75 21h16.5A2.25 2.25 0 0022.5 18.75V5.25A2.25 2.25 0 0020.25 3H3.75A2.25 2.25 0 001.5 5.25v13.5A2.25 2.25 0 003.75 21z"/>
            </svg>
            <p>Start typing to search your photos</p>
        </div>
    </div>
    <div id="index-panel" class="hidden">
        <h2 style="margin-bottom: 1rem; font-size: 1.1rem; font-weight: 500; color: #ccc;">Add Photos</h2>
        <div class="index-form">
            <div class="form-group">
                <label for="folder">Folder to index</label>
                <input type="text" id="folder" value="./photos" placeholder="./photos">
            </div>
            <div class="form-group">
                <label for="provider">Provider</label>
                <select id="provider" onchange="updateModels()">
                    <option value="anthropic">Anthropic Claude</option>
                    <option value="openai">OpenAI GPT-4o</option>
                    <option value="qwen">Qwen VL</option>
                </select>
            </div>
            <div class="form-group">
                <label for="model">Model</label>
                <select id="model"></select>
            </div>
            <div class="form-group checkbox-group">
                <input type="checkbox" id="recursive" checked>
                <label for="recursive">Include subdirectories</label>
            </div>
            <div class="form-group">
                <label for="delay">Delay between images (seconds)</label>
                <input type="number" id="delay" value="0.5" min="0" step="0.1">
            </div>
            <button class="btn" id="start-btn" onclick="startIndexing()">Start Indexing</button>
            <div id="progress"></div>
            <hr style="border: none; border-top: 1px solid #333; margin: 1.5rem 0;">
            <h3 style="margin-bottom: 0.75rem; font-size: 0.95rem; font-weight: 500; color: #aaa;">Maintenance</h3>
            <button class="btn" onclick="rebuildFts()">Rebuild Search Index</button>
            <div id="fts-status" style="margin-top: 0.5rem; font-size: 0.85rem; color: #888;"></div>
        </div>
    </div>

    <div class="footer" id="footer">
        <span id="photo-count">Loading...</span>
    </div>

    <script>
        let providers = {};
        let pollInterval = null;

        // Load provider settings
        fetch('/api/settings')
            .then(r => r.json())
            .then(data => { providers = data; updateModels(); });

        // Load photo count
        function updateStats() {
            fetch('/api/stats')
                .then(r => r.json())
                .then(data => {
                    const count = document.getElementById('photo-count');
                    const errors = data.errors > 0 ? ` (${data.errors} errors)` : '';
                    count.textContent = `${data.total} photos indexed${errors}`;
                });
        }
        updateStats();

        function showTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('results').classList.toggle('hidden', tab !== 'search');
            document.getElementById('index-panel').classList.toggle('hidden', tab !== 'settings');
        }

        function updateModels() {
            const provider = document.getElementById('provider').value;
            const modelSelect = document.getElementById('model');
            const models = providers[provider]?.models || [];
            const defaultModel = providers[provider]?.default_model || '';
            modelSelect.innerHTML = models.map(m =>
                `<option value="${m}" ${m === defaultModel ? 'selected' : ''}>${m}</option>`
            ).join('');
        }

        function startIndexing() {
            const params = new URLSearchParams({
                folder: document.getElementById('folder').value,
                provider: document.getElementById('provider').value,
                model: document.getElementById('model').value,
                recursive: document.getElementById('recursive').checked,
                delay: document.getElementById('delay').value,
            });

            document.getElementById('start-btn').disabled = true;
            fetch('/api/index?' + params.toString(), { method: 'POST' })
                .then(r => r.json())
                .then(data => {
                    if (data.error) {
                        document.getElementById('progress').innerHTML =
                            `<div class="progress-text error">${data.error}</div>`;
                        document.getElementById('start-btn').disabled = false;
                    } else {
                        startPolling();
                    }
                });
        }

        function startPolling() {
            if (pollInterval) clearInterval(pollInterval);
            // Show initial "Starting..." state
            document.getElementById('progress').innerHTML = `
                <div class="progress-bar">
                    <div class="progress-track">
                        <div class="progress-fill" style="width: 0%"></div>
                    </div>
                    <div class="progress-text">Starting...</div>
                </div>
            `;
            // Wait a moment for the background thread to start
            pollInterval = setInterval(updateProgress, 1000);
        }

        function updateProgress() {
            fetch('/api/index/status')
                .then(r => r.json())
                .then(data => {
                    if (!data.active && !data.message) {
                        clearInterval(pollInterval);
                        document.getElementById('start-btn').disabled = false;
                        return;
                    }

                    const pct = data.total > 0 ? Math.round((data.processed / data.total) * 100) : 0;
                    document.getElementById('progress').innerHTML = `
                        <div class="progress-bar">
                            <div class="progress-track">
                                <div class="progress-fill" style="width: ${pct}%"></div>
                            </div>
                            <div class="progress-text ${data.message.startsWith('Error') ? 'error' : ''}">
                                ${data.message || 'Processing...'} ${data.current_file ? '(' + data.current_file + ')' : ''}
                            </div>
                        </div>
                    `;

                    if (!data.active) {
                        clearInterval(pollInterval);
                        document.getElementById('start-btn').disabled = false;
                    }
                });
        }

        function deletePhoto(filepath, id) {
            if (!confirm('Delete this photo from the database?')) return;
            const card = document.getElementById('photo-' + id);
            card.classList.add('deleting');
            fetch('/api/photos/' + encodeURIComponent(filepath), { method: 'DELETE' })
                .then(r => r.json())
                .then(data => {
                    if (data.error) {
                        alert(data.error);
                        card.classList.remove('deleting');
                    } else {
                        card.remove();
                        updateStats();
                    }
                });
        }

        function rebuildFts() {
            const status = document.getElementById('fts-status');
            status.textContent = 'Rebuilding...';
            fetch('/api/rebuild-fts', { method: 'POST' })
                .then(r => r.json())
                .then(data => {
                    if (data.error) {
                        status.textContent = data.error;
                        status.style.color = '#ff6b6b';
                    } else {
                        status.textContent = 'Search index rebuilt successfully';
                        status.style.color = '#888';
                    }
                });
        }
    </script>
</body>
</html>
